name: Stage verified source migration
on:
  push:
    branches: [codex/curseforge-publisher-migration]
    paths: [migration-payload.json.gz.b64]
permissions:
  contents: write
  actions: read
concurrency:
  group: source-migration-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read approved migration input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: inputs
          persist-credentials: false
      - name: Read pinned target baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be5390c1a1c7d2765a4bf9c2121223e18be291e5
          path: target
          persist-credentials: false
      - name: Read pinned reference implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmanueltremblay9-stack/Immersive-Engineer-Decor-Controls-Tool-Reforged
          ref: de97f77ccc65351f13b325ef7939e1878ad681f8
          path: reference
          persist-credentials: false
      - name: Reconstruct and validate exact approved source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          parts=[pathlib.Path(f'inputs/migration-payload-{i}.b64').read_text().strip() for i in range(1,5)]
          # Repair one identified transfer transcription; the approved payload hash below remains mandatory.
          parts[1]=parts[1].replace('W4dtlqG1','W4dtLqG1')
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(raw)<1000000
          assert hashlib.sha256(raw).hexdigest()=='1ee22077a505b4b7a38af1adfc6902e7b944b5176f543426c766455bcbf96a6d', 'unreviewed migration input'
          payload=json.loads(raw)
          assert payload['baselineCommit']=='be5390c1a1c7d2765a4bf9c2121223e18be291e5'
          assert payload['referenceCommit']=='de97f77ccc65351f13b325ef7939e1878ad681f8'
          allowed_roots={'.gitattributes','.gitignore','00_START_HERE.txt','01_CODEX_MASTER_PROMPT.txt','AGENTS.md','CHANGELOG.md','README.md','build.gradle'}
          allowed_workflows={'.github/workflows/build.yml','.github/workflows/publish-curseforge.yml'}
          seen=set()
          for item in payload['files']:
              name=item['path']; path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name and name not in seen
              assert name in allowed_roots or name in allowed_workflows or name.startswith(('tools/release/','tools/ci/','docs/CURSEFORGE_'))
              seen.add(name)
              if 'content' in item:
                  result=item['content'].encode('utf-8')
              else:
                  assert item['source'] in {'target','reference'}
                  original=pathlib.Path(item['source'],name).read_bytes()
                  assert hashlib.sha256(original).hexdigest()==item['beforeSha256'], 'source baseline drift'
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  limit=len(lines)
                  for edit in reversed(item['edits']):
                      assert 0<=edit['start']<=edit['end']<=limit
                      lines[edit['start']:edit['end']]=edit['text'].splitlines(keepends=True)
                      limit=edit['start']
                  result=''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==item['sha256'], 'reconstructed source mismatch'
              destination=pathlib.Path('target',name); destination.parent.mkdir(parents=True,exist_ok=True); destination.write_bytes(result)
          subprocess.run(['git','add','-A'],cwd='target',check=True)
          subprocess.run(['python','scripts/refresh_project_manifest.py'],cwd='target',check=True)
          assert hashlib.sha256(pathlib.Path('target/PROJECT_MANIFEST.json').read_bytes()).hexdigest()==payload['manifestExpectedSha256'], 'manifest source bytes drifted'
          pathlib.Path('evidence/approved-payload.json').write_bytes(raw)
          PY
          cd target
          python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v 2>&1 | tee ../evidence/publisher-tests.log
          python -m unittest discover -s tools/ci -p 'test_*.py' -v 2>&1 | tee ../evidence/ci-contract-tests.log
          python -m unittest scripts/test_check_beta_release_gate.py -v 2>&1 | tee ../evidence/release-checker-tests.log
          python scripts/validate_specs.py
          python scripts/generate_alpha_resources.py
          python scripts/qa_alpha_resources.py
          git diff HEAD --exit-code -- src/
          git diff --check HEAD
      - name: Create source tree and commit without moving any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repository='emmanueltremblay9-stack/Immersive-BOP_Harvest'
          assert os.environ['GITHUB_REPOSITORY']==repository
          api='https://api.github.com/repos/'+repository
          def request(method,path,value=None):
              data=None if value is None else json.dumps(value).encode('utf-8')
              req=urllib.request.Request(api+path,data=data,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          payload=json.loads(pathlib.Path('evidence/approved-payload.json').read_text())
          baseline=request('GET','/git/commits/'+payload['baselineCommit'])
          entries=[]
          for item in payload['files']:
              raw=pathlib.Path('target',item['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==item['sha256']
              entries.append({'path':item['path'],'type':'blob','mode':'100644','content':raw.decode('utf-8')})
          manifest=pathlib.Path('target/PROJECT_MANIFEST.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest()==payload['manifestExpectedSha256']
          entries.append({'path':'PROJECT_MANIFEST.json','type':'blob','mode':'100644','content':manifest.decode('utf-8')})
          tree=request('POST','/git/trees',{'base_tree':baseline['tree']['sha'],'tree':entries})
          commit=request('POST','/git/commits',{'message':'feat: integrate generic fail-closed CurseForge publisher and portable CI','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          report={'status':'SOURCE_COMMIT_CREATED_NOT_REFERENCED','commitSha':commit['sha'],'treeSha':tree['sha'],'parentSha':os.environ['GITHUB_SHA'],'baselineSha':payload['baselineCommit'],'manifestSha256':payload['manifestExpectedSha256'],'productionCurseForgeUpload':False,'branchMoved':False}
          pathlib.Path('evidence/staged-commit.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Preserve source staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-migration-staging-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
