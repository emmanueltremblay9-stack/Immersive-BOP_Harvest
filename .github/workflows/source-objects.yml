name: Stage verified non-workflow source objects
on:
  push:
    branches: [codex/curseforge-publisher-migration]
    paths: [.github/workflows/source-objects.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: inputs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be5390c1a1c7d2765a4bf9c2121223e18be291e5
          path: target
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmanueltremblay9-stack/Immersive-Engineer-Decor-Controls-Tool-Reforged
          ref: de97f77ccc65351f13b325ef7939e1878ad681f8
          path: reference
          persist-credentials: false
      - name: Create exact non-workflow tree without moving a branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          parts=[pathlib.Path(f'inputs/migration-payload-{i}.b64').read_text().strip() for i in range(1,5)]
          parts[1]=parts[1].replace('W4dtlqG1','W4dtLqG1')
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='1ee22077a505b4b7a38af1adfc6902e7b944b5176f543426c766455bcbf96a6d'
          payload=json.loads(raw)
          entries=[]
          for item in payload['files']:
              name=item['path']
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              if 'content' in item:
                  result=item['content'].encode('utf-8')
              else:
                  original=pathlib.Path(item['source'],name).read_bytes()
                  assert hashlib.sha256(original).hexdigest()==item['beforeSha256']
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(item['edits']):lines[edit['start']:edit['end']]=edit['text'].splitlines(keepends=True)
                  result=''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==item['sha256']
              dest=pathlib.Path('target',name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(result)
              if not name.startswith('.github/'):
                  entries.append({'path':name,'mode':'100644','type':'blob','content':result.decode('utf-8')})
          subprocess.run(['git','add','-A'],cwd='target',check=True)
          subprocess.run(['python','scripts/refresh_project_manifest.py'],cwd='target',check=True)
          manifest=pathlib.Path('target/PROJECT_MANIFEST.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest()==payload['manifestExpectedSha256']
          entries.append({'path':'PROJECT_MANIFEST.json','mode':'100644','type':'blob','content':manifest.decode('utf-8')})
          subprocess.run(['git','add','-A'],cwd='target',check=True)
          expected_tree=subprocess.check_output(['git','write-tree'],cwd='target',text=True).strip()
          url='https://api.github.com/repos/emmanueltremblay9-stack/Immersive-BOP_Harvest/git/trees'
          req=urllib.request.Request(url,data=json.dumps({'base_tree':'5ba2d039f0c0f51d44067bb3739f108d44439e0c','tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=90) as response:tree=json.load(response)
          pathlib.Path('evidence').mkdir(exist_ok=True)
          report={'status':'NON_WORKFLOW_TREE_CREATED_NOT_REFERENCED','treeSha':tree['sha'],'expectedCompleteTreeSha':expected_tree,'baselineSha':payload['baselineCommit'],'parentSha':os.environ['GITHUB_SHA'],'branchMoved':False,'productionCurseForgeUpload':False}
          pathlib.Path('evidence/source-tree.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-objects-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
