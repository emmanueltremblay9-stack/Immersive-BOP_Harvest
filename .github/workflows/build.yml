name: Build and validate
on:
  push:
    branches: [main, codex/curseforge-publisher-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Gradle validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Clean Gradle outputs before collecting evidence
        shell: bash
        run: bash gradlew --no-configuration-cache clean --stacktrace > "$RUNNER_TEMP/bop-clean.log" 2>&1
      - name: Test publisher safety first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v 2>&1 | tee build/ci-evidence/publisher-tests.log
          python -m unittest discover -s tools/ci -p 'test_*.py' -v 2>&1 | tee build/ci-evidence/runtime-lock-tests.log
      - name: Validate specification and deterministic resources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_specs.py
          python scripts/generate_alpha_resources.py
          python scripts/generate_alpha_resources.py
          python scripts/qa_alpha_resources.py
          python -m unittest scripts/test_check_beta_release_gate.py scripts/test_check_stable_release_gate.py -v
          git diff --exit-code -- src/main/resources
      - name: Check authoritative manifest ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_project_manifest.py
          git diff --exit-code -- PROJECT_MANIFEST.json
      - name: Lint GitHub Actions workflows
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Gradle check and build
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-configuration-cache check build --stacktrace 2>&1 | tee build/ci-evidence/gradle-build.log
      - name: Supply exact isolated runtime dependencies without Prism
        shell: bash
        run: python tools/ci/prepare_runtime.py
      - name: Required GameTests and datagen
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/prepare_runtime.py --check-only
          # Skip only the Windows/Prism copy task: exact locked bytes were validated above.
          # No gameplay, GameTest, metadata or specification gate is skipped.
          bash gradlew --no-configuration-cache runGameTestServer runData -x syncRuntimeDeps --stacktrace 2>&1 | tee build/ci-evidence/runtime.log
          git diff --exit-code -- src/main/resources src/generated/resources
          bash gradlew --no-configuration-cache runData -x syncRuntimeDeps --stacktrace 2>&1 | tee build/ci-evidence/datagen-repeat.log
          git diff --exit-code -- src/main/resources src/generated/resources
          git diff --check
      - name: Retain non-production validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/
            build/reports/
            ${{ runner.temp }}/bop-clean.log
          if-no-files-found: error
          retention-days: 30
  windows-manifest:
    name: Windows manifest regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test publisher safety first
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci-evidence | Out-Null
          python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v *> build/ci-evidence/publisher-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test source consumers and strict stable evidence
        shell: pwsh
        run: |
          python -m unittest discover -s tools/ci -p 'test_*.py' -v *> build/ci-evidence/manifest-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/test_check_beta_release_gate.py scripts/test_check_stable_release_gate.py -v *> build/ci-evidence/release-gate-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refresh_project_manifest.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 30
