name: Publish CurseForge
run-name: "CurseForge ${{ github.event_name == 'workflow_run' && 'v0.1.1' || startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }} :: publish"

on:
  workflow_run:
    workflows:
      - Build and validate
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed GitHub release tag
        required: true
        type: string
      manifest_path:
        description: Reviewed repository-relative versioned manifest (not the template)
        required: true
        type: string
      dry_run:
        description: Validate all public inputs without uploading
        required: true
        type: boolean
        default: true
      resume_file_id:
        description: Existing CurseForge file ID to poll without uploading again
        required: false
        type: string
        default: ""
      receipt_recovery:
        description: Recover the deterministic receipt for existing CurseForge file 8900758 only
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-stable-${{ github.event_name == 'workflow_run' && 'v0.1.1' || startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}
  cancel-in-progress: false

jobs:
  reject-unqualified-source:
    name: Reject unqualified upstream source
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          (github.event.workflow_run.name != 'Build and validate' ||
           github.event.workflow_run.path != '.github/workflows/build.yml' ||
           github.event.workflow_run.head_repository.full_name != github.repository ||
           github.event.workflow_run.event != 'push' ||
           github.event.workflow_run.head_branch != 'main' ||
           github.event.workflow_run.conclusion != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record rejected upstream source
        shell: bash
        run: |
          echo "SOURCE_READINESS_BLOCKED: canonical successful push/main required"
          exit 1

  source-readiness:
    name: Evaluate authenticated stable auto-publish eligibility
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Build and validate' &&
          github.event.workflow_run.path == '.github/workflows/build.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auto_publish_eligible: ${{ steps.eligibility.outputs.auto_publish_eligible }}
    steps:
      - name: Checkout exact upstream head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check CurseForge credential availability
        id: credential
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [[ -n "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate exact stable runtime gates without mutation
        id: eligibility
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SOURCE_REPORT_PATH="$RUNNER_TEMP/stable-source-readiness.json"
          credential_flag=()
          if [[ "${{ steps.credential.outputs.available }}" == "true" ]]; then
            credential_flag+=(--credential-available)
          fi
          set +e
          python tools/release/stable_autopublish.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$SOURCE_REPORT_PATH" \
            "${credential_flag[@]}"
          status=$?
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["SOURCE_REPORT_PATH"]).read_text(encoding="utf-8"))
          summary = {
              key: report.get(key)
              for key in (
                  "status", "verdict", "sourceReady", "stableReady",
                  "autoPublishEligible", "publicationComplete",
                  "publicationAuthority", "autoPublishBlockers",
              )
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("### Stable auto-publish eligibility\n\n```json\n")
              stream.write(json.dumps(summary, indent=2, sort_keys=True))
              stream.write("\n```\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(
                  "auto_publish_eligible="
                  + ("true" if report.get("autoPublishEligible") is True else "false")
                  + "\n"
              )
          PY
          exit "$status"

  auto-publish:
    name: Automatic stable GitHub and CurseForge publication
    needs: source-readiness
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          needs.source-readiness.outputs.auto_publish_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      MANIFEST_PATH: tools/release/curseforge_release_0.1.1.json
      REQUESTED_TAG: v0.1.1

    steps:
      - name: Checkout exact qualified head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Initialize automatic publication paths
        shell: bash
        run: |
          {
            echo "SOURCE_REPORT_PATH=$RUNNER_TEMP/stable-source-readiness.json"
            echo "CANDIDATE_PATH=$RUNNER_TEMP/immersive_bop_harvest-0.1.1.jar"
            echo "GITHUB_REPORT_PATH=$RUNNER_TEMP/github-publication.json"
            echo "PREPARE_REPORT_PATH=$RUNNER_TEMP/curseforge-upload-intent.json"
            echo "RESULT_REPORT_PATH=$RUNNER_TEMP/curseforge-publication-result.json"
            echo "RECEIPT_PATH=$RUNNER_TEMP/stable-publication-receipt.json"
            echo "RECEIPT_STATE_PATH=$RUNNER_TEMP/stable-publication-receipt-state.json"
            echo "RECEIPT_VERIFY_PATH=$RUNNER_TEMP/stable-publication-receipt-verification.json"
          } >> "$GITHUB_ENV"

      - name: Check CurseForge credential availability for exact preflight
        id: auto-credential
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [[ -n "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-evaluate exact stable gates immediately before mutation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          credential_flag=()
          if [[ "${{ steps.auto-credential.outputs.available }}" == "true" ]]; then
            credential_flag+=(--credential-available)
          fi
          python tools/release/stable_autopublish.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$SOURCE_REPORT_PATH" \
            "${credential_flag[@]}"

      - name: Reconcile or create exact GitHub tag Release and asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/stable_publish.py github \
            --source-report "$SOURCE_REPORT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --candidate-output "$CANDIDATE_PATH" \
            --github-report "$GITHUB_REPORT_PATH"

      - name: Prepare exact CurseForge upload intent without posting
        id: auto-prepare
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/publish_curseforge.py \
            --prepare-publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --report "$PREPARE_REPORT_PATH"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from publish_curseforge import state_artifact_prefix
          path = Path(os.environ["PREPARE_REPORT_PATH"])
          report = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              if report.get("status") == "UPLOAD_INTENT_READY" and report.get("postRequired") is True:
                  name = (f"{state_artifact_prefix(report['tag'])}{report['runKey']}--intent--"
                          f"{report['multipartSha256'][:12]}")
                  stream.write("post_required=true\n")
                  stream.write(f"artifact_name={name}\n")
              elif report.get("status") in {"ALREADY_PUBLISHED", "RESUMED_PUBLICATION_VERIFIED"}:
                  path.replace(Path(os.environ["RESULT_REPORT_PATH"]))
                  stream.write("post_required=false\n")
              else:
                  raise SystemExit("unsupported automatic prepare state")
          PY

      - name: Persist upload intent before any POST
        id: auto-persist-intent
        if: ${{ steps.auto-prepare.outputs.post_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.auto-prepare.outputs.artifact_name }}
          path: ${{ env.PREPARE_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Submit automatic exact persisted request once
        id: auto-submit
        if: ${{ steps.auto-prepare.outputs.post_required == 'true' && steps.auto-persist-intent.outcome == 'success' }}
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_ID: ${{ steps.auto-persist-intent.outputs.artifact-id }}
        run: |
          python tools/release/publish_curseforge.py \
            --submit \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --intent-report "$PREPARE_REPORT_PATH" \
            --intent-artifact-id "$INTENT_ARTIFACT_ID" \
            --report "$RESULT_REPORT_PATH"

      - name: Derive accepted CurseForge checkpoint metadata
        id: auto-accepted-metadata
        if: ${{ steps.auto-prepare.outputs.post_required == 'true' && steps.auto-submit.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from publish_curseforge import state_artifact_prefix
          path = Path(os.environ["RESULT_REPORT_PATH"])
          report = json.loads(path.read_text(encoding="utf-8"))
          file_id = report.get("fileId")
          if report.get("status") != "UPLOAD_ACCEPTED" or not isinstance(file_id, int) or file_id <= 0:
              raise SystemExit("automatic submit did not return a valid accepted file ID")
          name = (f"{state_artifact_prefix(str(report.get('tag', 'unknown')))}"
                  f"{os.environ['RUN_KEY']}--accepted--{file_id}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={name}\n")
              stream.write(f"file_id={file_id}\n")
          PY

      - name: Persist accepted CurseForge file ID before polling
        id: auto-persist-accepted
        if: ${{ steps.auto-accepted-metadata.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.auto-accepted-metadata.outputs.artifact_name }}
          path: ${{ env.RESULT_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Resume accepted file without a token or second POST
        id: auto-resume
        if: ${{ steps.auto-prepare.outputs.post_required == 'true' && steps.auto-persist-accepted.outcome == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --resume-file-id "${{ steps.auto-accepted-metadata.outputs.file_id }}" \
            --report "$RESULT_REPORT_PATH"

      - name: Derive automatic result artifact name
        id: auto-result-metadata
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from publish_curseforge import state_artifact_prefix
          path = Path(os.environ["RESULT_REPORT_PATH"])
          if not path.is_file():
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          status = str(report.get("status", "REPORT_INVALID"))
          if not re.fullmatch(r"[A-Z0-9_]+", status):
              status = "REPORT_INVALID"
          file_id = report.get("fileId", 0)
          if not isinstance(file_id, int) or file_id < 0:
              file_id = 0
          name = (f"{state_artifact_prefix(str(report.get('tag', 'unknown')))}"
                  f"{os.environ['RUN_KEY']}--result--{status}--{file_id}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={name}\n")
          PY

      - name: Persist automatic CurseForge result
        if: ${{ always() && steps.auto-result-metadata.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.auto-result-metadata.outputs.artifact_name }}
          path: ${{ env.RESULT_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Build final receipt after fresh public readbacks
        id: auto-finalize
        if: >-
          ${{ always() && !cancelled() && steps.auto-prepare.outcome == 'success' &&
              (steps.auto-prepare.outputs.post_required == 'false' ||
               steps.auto-resume.outcome == 'success') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/stable_publish.py finalize \
            --source-report "$SOURCE_REPORT_PATH" \
            --github-report "$GITHUB_REPORT_PATH" \
            --curseforge-report "$RESULT_REPORT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --receipt "$RECEIPT_PATH" \
            --receipt-state-report "$RECEIPT_STATE_PATH"

      - name: Read deterministic receipt reconciliation state
        id: auto-receipt-state
        if: ${{ steps.auto-finalize.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path(os.environ["RECEIPT_STATE_PATH"]).read_text(encoding="utf-8"))
          if state.get("status") not in {"RECEIPT_ABSENT", "RECEIPT_EXACT"}:
              raise SystemExit("invalid final receipt reconciliation state")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={state['artifactName']}\n")
              stream.write("upload_required=" + ("true" if state["uploadRequired"] else "false") + "\n")
          PY

      - name: Persist deterministic final publication receipt
        id: auto-persist-receipt
        if: ${{ steps.auto-receipt-state.outputs.upload_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.auto-receipt-state.outputs.artifact_name }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Read back exact persisted final receipt
        if: ${{ steps.auto-receipt-state.outcome == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          artifact_args=()
          if [[ "${{ steps.auto-receipt-state.outputs.upload_required }}" == "true" ]]; then
            artifact_args+=(--artifact-id "${{ steps.auto-persist-receipt.outputs.artifact-id }}")
          fi
          python tools/release/stable_publish.py verify-receipt \
            --repo-root "$GITHUB_WORKSPACE" \
            --receipt "$RECEIPT_PATH" \
            --report "$RECEIPT_VERIFY_PATH" \
            "${artifact_args[@]}"

  receipt-recovery:
    name: Recover deterministic stable publication receipt
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.receipt_recovery }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_BRANCH: codex/s7-receipt-recovery
      EXPECTED_MAIN: a0d1c81dc0108c9dd062cb0faf67641426bd6218
      EXPECTED_TREE: 2b0891a836908513fd462cb3996fa0bc7515ed85
      EXPECTED_PUBLICATION_KEY: d2e24e6b8f8c00190d1f3cddee8cc06296fb43f1dcb0ba006353473bb0c10a4a
      SOURCE_RUN_ID: "35178395254"
      ORIGINAL_PUBLICATION_RUN_ID: "35179000121"
      INTENT_ARTIFACT_ID: "10479528843"
      INTENT_ARCHIVE_SHA256: a75eb63c5949803a7a0c5b587e9e26e8ffb243090bd97854d31e0a646c64f7f1
      ACCEPTED_ARTIFACT_ID: "10479454366"
      ACCEPTED_ARCHIVE_SHA256: d372e63da8725f3270515a384f265ec4d2ccbc77c42ecaaedebddd530982cc49
      EXISTING_CURSEFORGE_FILE_ID: "8900758"
      MANIFEST_PATH: tools/release/curseforge_release_0.1.1.json
      REQUESTED_TAG: v0.1.1

    steps:
      - name: Enforce the bounded receipt-recovery dispatch contract
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_MANIFEST: ${{ inputs.manifest_path }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_RESUME_FILE_ID: ${{ inputs.resume_file_id }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" ]]
          [[ "$DISPATCH_TAG" == "$REQUESTED_TAG" ]]
          [[ "$DISPATCH_MANIFEST" == "$MANIFEST_PATH" ]]
          [[ "$DISPATCH_DRY_RUN" == "true" ]]
          [[ "$DISPATCH_RESUME_FILE_ID" == "$EXISTING_CURSEFORGE_FILE_ID" ]]
          [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]

      - name: Checkout exact qualified main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a0d1c81dc0108c9dd062cb0faf67641426bd6218
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Initialize receipt-recovery paths
        shell: bash
        run: |
          {
            echo "SOURCE_REPORT_PATH=$RUNNER_TEMP/stable-source-readiness.json"
            echo "RECOVERY_EVENT_PATH=$RUNNER_TEMP/recovery-workflow-run.json"
            echo "GITHUB_REPORT_PATH=$RUNNER_TEMP/github-publication-readback.json"
            echo "RESULT_REPORT_PATH=$RUNNER_TEMP/curseforge-publication-result.json"
            echo "RECEIPT_PATH=$RUNNER_TEMP/stable-publication-receipt.json"
            echo "RECEIPT_STATE_PATH=$RUNNER_TEMP/stable-publication-receipt-state.json"
            echo "RECEIPT_VERIFY_PATH=$RUNNER_TEMP/stable-publication-receipt-verification.json"
          } >> "$GITHUB_ENV"

      - name: Verify exact main and absence of a concurrent publication write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from tools.ci import candidate_evidence

          expected_main = os.environ["EXPECTED_MAIN"]
          expected_tree = os.environ["EXPECTED_TREE"]
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          if subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip() != expected_main:
              raise SystemExit("RECOVERY_CHECKOUT_COMMIT_DRIFT_STOP")
          if subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip() != expected_tree:
              raise SystemExit("RECOVERY_CHECKOUT_TREE_DRIFT_STOP")
          api = candidate_evidence.GitHub()
          main_ref = api.get("git/ref/heads/main")
          if main_ref.get("object", {}).get("sha") != expected_main:
              raise SystemExit("CURRENT_MAIN_DRIFT_STOP")
          conflicts = []
          for status in ("queued", "in_progress", "waiting", "requested", "pending"):
              result = api.get(
                  "actions/workflows/publish-curseforge.yml/runs"
                  f"?status={status}&per_page=100"
              )
              for run in result.get("workflow_runs", []):
                  if run.get("id") != current_run_id:
                      conflicts.append({"id": run.get("id"), "status": run.get("status")})
          if conflicts:
              raise SystemExit("CONCURRENT_PUBLICATION_RUN_STOP")
          print({"main": expected_main, "tree": expected_tree, "conflicts": 0})
          PY

      - name: Rebuild exact source report from persisted original evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tools.ci import candidate_evidence
          from tools.release import stable_autopublish

          expected_main = os.environ["EXPECTED_MAIN"]
          source_run_id = int(os.environ["SOURCE_RUN_ID"])
          publication_run_id = int(os.environ["ORIGINAL_PUBLICATION_RUN_ID"])
          api = candidate_evidence.GitHub()

          def require(condition, reason):
              if not condition:
                  raise SystemExit(reason)

          publication_run = api.get(f"actions/runs/{publication_run_id}")
          expected_run = {
              "id": publication_run_id,
              "event": "workflow_run",
              "status": "completed",
              "conclusion": "failure",
              "head_sha": expected_main,
              "run_attempt": 1,
              "path": ".github/workflows/publish-curseforge.yml",
          }
          for field, expected in expected_run.items():
              if publication_run.get(field) != expected:
                  raise SystemExit(f"ORIGINAL_PUBLICATION_RUN_{field.upper()}_DRIFT_STOP")
          jobs = api.get(f"actions/runs/{publication_run_id}/jobs?per_page=100").get("jobs", [])
          eligibility_jobs = [
              job for job in jobs
              if job.get("name") == "Evaluate authenticated stable auto-publish eligibility"
              and job.get("status") == "completed"
              and job.get("conclusion") == "success"
          ]
          require(len(eligibility_jobs) == 1, "ORIGINAL_ELIGIBILITY_JOB_IDENTITY_STOP")
          publish_jobs = [
              job for job in jobs
              if job.get("name") == "Automatic stable GitHub and CurseForge publication"
              and job.get("status") == "completed"
              and job.get("conclusion") == "failure"
          ]
          require(len(publish_jobs) == 1, "ORIGINAL_PUBLISH_JOB_IDENTITY_STOP")
          successful_steps = {
              step.get("name") for step in publish_jobs[0].get("steps", [])
              if step.get("status") == "completed" and step.get("conclusion") == "success"
          }
          for name in (
              "Re-evaluate exact stable gates immediately before mutation",
              "Prepare exact CurseForge upload intent without posting",
              "Persist upload intent before any POST",
              "Submit automatic exact persisted request once",
              "Persist accepted CurseForge file ID before polling",
          ):
              require(name in successful_steps, "ORIGINAL_PUBLISH_CHECKPOINT_STEPS_STOP")

          def artifact_report(artifact_id, archive_sha256, artifact_name, filename):
              metadata = api.get(f"actions/artifacts/{artifact_id}")
              require(
                  metadata.get("id") == artifact_id
                  and metadata.get("name") == artifact_name
                  and metadata.get("expired") is False
                  and metadata.get("digest") == "sha256:" + archive_sha256
                  and metadata.get("workflow_run", {}).get("id") == publication_run_id
                  and metadata.get("workflow_run", {}).get("head_sha") == expected_main,
                  "ORIGINAL_CHECKPOINT_ARTIFACT_IDENTITY_STOP",
              )
              archive = api.get(f"actions/artifacts/{artifact_id}/zip", binary=True)
              require(
                  hashlib.sha256(archive).hexdigest() == archive_sha256,
                  "ORIGINAL_CHECKPOINT_ARCHIVE_HASH_STOP",
              )
              files = candidate_evidence.contents(archive)
              require(set(files) == {filename}, "ORIGINAL_CHECKPOINT_CONTENT_STOP")
              value = json.loads(
                  files[filename].decode("utf-8"),
                  object_pairs_hook=candidate_evidence.unique,
              )
              require(isinstance(value, dict), "ORIGINAL_CHECKPOINT_CONTENT_STOP")
              return value

          intent_id = int(os.environ["INTENT_ARTIFACT_ID"])
          intent = artifact_report(
              intent_id,
              os.environ["INTENT_ARCHIVE_SHA256"],
              "cfpub-v0.1.1-52161cb817159321--35179000121-1--intent--f621e5ac5ebf",
              "curseforge-upload-intent.json",
          )
          accepted = artifact_report(
              int(os.environ["ACCEPTED_ARTIFACT_ID"]),
              os.environ["ACCEPTED_ARCHIVE_SHA256"],
              "cfpub-v0.1.1-52161cb817159321--35179000121-1--accepted--8900758",
              "curseforge-publication-result.json",
          )
          require(
              intent.get("status") == "UPLOAD_INTENT_READY"
              and intent.get("verdict") == "PASS"
              and intent.get("postRequired") is True
              and intent.get("runKey") == "35179000121-1"
              and accepted.get("status") == "UPLOAD_ACCEPTED"
              and accepted.get("fileId") == int(os.environ["EXISTING_CURSEFORGE_FILE_ID"])
              and accepted.get("intentArtifactId") == intent_id
              and accepted.get("intentArtifactName")
                  == "cfpub-v0.1.1-52161cb817159321--35179000121-1--intent--f621e5ac5ebf"
              and accepted.get("multipartSha256") == intent.get("multipartSha256")
              and accepted.get("postRequired") is False,
              "ORIGINAL_ACCEPTED_CHECKPOINT_DIVERGENT_STOP",
          )
          baseline = intent.get("curseForgeBaseline", {})
          historical_relations = tuple(sorted(
              (row.get("projectId"), row.get("slug"), row.get("type"))
              for row in baseline.get("previousFileRelations", [])
              if isinstance(row, dict)
          ))
          require(
              baseline.get("projectIdentity") == {
                  "projectId": 1609013,
                  "projectSlug": "immersive-bop-harvest",
                  "source": "OFFICIAL_FILE_PAGE_AND_FILE_API",
              }
              and historical_relations
                  == tuple(sorted(stable_autopublish.EXPECTED_HISTORICAL_RELATIONS))
              and baseline.get("projectRelations") == []
              and baseline.get("projectRelationsCheck") == "MATCHED",
              "ORIGINAL_PREPUBLICATION_GATES_DIVERGENT_STOP",
          )

          source_run = api.get(f"actions/runs/{source_run_id}")
          expected_source = {
              "id": source_run_id,
              "name": "Build and validate",
              "path": ".github/workflows/build.yml",
              "event": "push",
              "head_branch": "main",
              "status": "completed",
              "conclusion": "success",
              "head_sha": expected_main,
              "run_attempt": 1,
          }
          for field, expected in expected_source.items():
              if source_run.get(field) != expected:
                  raise SystemExit(f"SOURCE_RUN_{field.upper()}_DRIFT_STOP")
          require(
              source_run.get("head_repository", {}).get("full_name")
                  == stable_autopublish.EXPECTED_REPOSITORY,
              "SOURCE_RUN_REPOSITORY_DRIFT_STOP",
          )
          event = {
              "repository": {"full_name": stable_autopublish.EXPECTED_REPOSITORY},
              "workflow_run": source_run,
          }
          stable_autopublish.write_report(Path(os.environ["RECOVERY_EVENT_PATH"]), event)
          recovery_gates = {
              "canonicalWorkflow": True,
              "exactCurrentMain": True,
              "authenticatedStableGate": True,
              "candidateIdentity": True,
              "versionedManifest": True,
              "releaseNotesHash": True,
              "credentialAvailable": True,
              "curseForgeProjectIdentity": True,
              "historicalFileRelations": True,
              "historicalProjectRelations": True,
              "targetRelations": True,
              "gitTagNonDivergent": True,
              "githubReleaseNonDivergent": True,
              "githubAssetNonDivergent": True,
              "curseForgeArtifactNonDivergent": True,
              "stableRelease": True,
              "automaticInvocation": True,
          }
          recovery_gates[stable_autopublish.AUTO_PUBLISH_GATE_NAMES[-1]] = True
          require(
              set(recovery_gates) == set(stable_autopublish.AUTO_PUBLISH_GATE_NAMES),
              "RECOVERY_GATE_SET_DRIFT_STOP",
          )
          report = stable_autopublish.evaluate_source_readiness(
              event,
              Path(os.environ["GITHUB_WORKSPACE"]),
              api=api,
              credential_available=True,
              _runtime_gate_evidence=recovery_gates,
          )
          require(
              report.get("status") == "AUTO_PUBLISH_ELIGIBLE"
              and report.get("verdict") == "PASS"
              and report.get("sourceReady") is True
              and report.get("stableReady") is True
              and report.get("autoPublishEligible") is True
              and report.get("runtimeGates") == recovery_gates
              and report.get("publicationComplete") is False
              and report.get("idempotenceKey") == os.environ["EXPECTED_PUBLICATION_KEY"],
              "RECOVERY_SOURCE_REPORT_DIVERGENT_STOP",
          )
          candidate = report["candidate"]
          require(
              intent.get("asset") == {
                  "name": candidate["name"],
                  "sha256": candidate["sha256"],
                  "size": candidate["size"],
              }
              and accepted.get("asset") == intent.get("asset"),
              "ORIGINAL_CHECKPOINT_CANDIDATE_DIVERGENT_STOP",
          )
          tag_state = stable_autopublish._github_tag_state(expected_main)
          release_state, asset_state = stable_autopublish._github_release_state(
              tag_state=tag_state,
              candidate={**candidate, "sourceCommit": expected_main},
              notes=(Path(os.environ["GITHUB_WORKSPACE"])
                     / stable_autopublish.EXPECTED_NOTES).read_text(encoding="utf-8"),
          )
          require(
              tag_state == "EXACT_RECONCILED"
              and release_state == "RELEASE_EXACT"
              and asset_state == "ASSET_EXACT",
              "RECOVERY_GITHUB_READBACK_DIVERGENT_STOP",
          )
          stable_autopublish.write_report(Path(os.environ["SOURCE_REPORT_PATH"]), report)
          print({
              "sourceRunId": source_run_id,
              "publicationRunId": publication_run_id,
              "intentArtifactId": intent_id,
              "acceptedArtifactId": int(os.environ["ACCEPTED_ARTIFACT_ID"]),
              "acceptedFileId": accepted["fileId"],
              "credentialEvidence": "ACCEPTED_CHECKPOINT",
              "status": report["status"],
              "publicationKey": report["idempotenceKey"],
          })
          PY

      - name: Build the GitHub report through a mutation-forbidden adapter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from tools.ci import candidate_evidence
          from tools.release import stable_publish

          class RecoveryReadOnlyGitHub(stable_publish.GitHubPublicationAdapter):
              def post_json(self, path, payload):
                  raise stable_publish.MutationError("RECOVERY_PUBLIC_MUTATION_FORBIDDEN")

              def upload_asset(self, upload_url, name, raw):
                  raise stable_publish.MutationError("RECOVERY_PUBLIC_MUTATION_FORBIDDEN")

          source_report = stable_publish.read_json(Path(os.environ["SOURCE_REPORT_PATH"]))
          api = candidate_evidence.GitHub()
          adapter = RecoveryReadOnlyGitHub(os.environ["GITHUB_TOKEN"])
          machine = stable_publish.StablePublication(Path(os.environ["GITHUB_WORKSPACE"]), adapter, api)
          validated = machine.validate_source_report(source_report)
          source = validated["source"]
          candidate = validated["candidate"]
          machine._current_main(source["sourceCommit"])
          raw = machine.download_candidate(source, candidate)
          if len(raw) != candidate["size"] or stable_publish.sha256(raw) != candidate["sha256"]:
              raise SystemExit("CANDIDATE_FRESH_READBACK_DIVERGENT_STOP")
          state = machine.inspect_github(
              source["sourceCommit"], validated["notes"], candidate, public=True
          )
          stable_publish.require(
              state.get("state") == "TAG_EXACT"
              and state.get("releaseState") == "RELEASE_EXACT"
              and state.get("assetState") == "ASSET_EXACT",
              "GITHUB_PUBLICATION_INCOMPLETE",
          )
          report = {
              "schemaVersion": 1,
              "status": "GITHUB_PUBLICATION_VERIFIED",
              "publicationKey": validated["publicationKey"],
              "repository": stable_publish.REPOSITORY,
              "qualifiedCommit": source["sourceCommit"],
              "qualifiedTree": source["sourceTree"],
              "tag": stable_publish.TAG,
              "tagState": state["state"],
              "resolvedCommit": state["resolvedCommit"],
              "releaseId": state["releaseId"],
              "releaseUrl": state["releaseUrl"],
              "releaseState": state["releaseState"],
              "assetId": state["assetId"],
              "assetName": state["assetName"],
              "assetSize": state["assetSize"],
              "assetSha256": state["assetSha256"],
              "assetState": state["assetState"],
              "operations": [],
              "publicationComplete": False,
          }
          stable_publish.write_report(Path(os.environ["GITHUB_REPORT_PATH"]), report)
          print({
              "status": report["status"],
              "qualifiedCommit": report["qualifiedCommit"],
              "assetId": report["assetId"],
              "assetSha256": report["assetSha256"],
              "operations": report["operations"],
          })
          PY

      - name: Resume existing CurseForge file without a token or second POST
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --resume-file-id "$EXISTING_CURSEFORGE_FILE_ID" \
            --report "$RESULT_REPORT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RESULT_REPORT_PATH"]).read_text(encoding="utf-8"))
          if (
              report.get("status") != "RESUMED_PUBLICATION_VERIFIED"
              or report.get("verdict") != "PASS"
              or report.get("fileId") != int(os.environ["EXISTING_CURSEFORGE_FILE_ID"])
              or report.get("postRequired") is not False
              or report.get("publicHashMatch") is not True
          ):
              raise SystemExit("CURSEFORGE_TOKENLESS_RESUME_DIVERGENT_STOP")
          print({
              "status": report["status"],
              "fileId": report["fileId"],
              "postRequired": report["postRequired"],
              "publicHashMatch": report["publicHashMatch"],
          })
          PY

      - name: Build final receipt after fresh public readbacks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/release/stable_publish.py finalize \
            --source-report "$SOURCE_REPORT_PATH" \
            --github-report "$GITHUB_REPORT_PATH" \
            --curseforge-report "$RESULT_REPORT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --receipt "$RECEIPT_PATH" \
            --receipt-state-report "$RECEIPT_STATE_PATH"

      - name: Read deterministic receipt reconciliation state
        id: recovery-receipt-state
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RECEIPT_STATE_PATH"]).read_text(encoding="utf-8"))
          if state.get("status") not in {"RECEIPT_ABSENT", "RECEIPT_EXACT"}:
              raise SystemExit("RECEIPT_RECONCILIATION_STATE_INVALID")
          if state.get("uploadRequired") is not (state["status"] == "RECEIPT_ABSENT"):
              raise SystemExit("RECEIPT_RECONCILIATION_STATE_DIVERGENT")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={state['artifactName']}\n")
              stream.write("upload_required=" + ("true" if state["uploadRequired"] else "false") + "\n")
          print({
              "status": state["status"],
              "artifactName": state["artifactName"],
              "uploadRequired": state["uploadRequired"],
          })
          PY

      - name: Persist deterministic final publication receipt
        id: recovery-persist-receipt
        if: ${{ steps.recovery-receipt-state.outputs.upload_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recovery-receipt-state.outputs.artifact_name }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Read back the exact persisted receipt and require one active artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          artifact_args=()
          if [[ "${{ steps.recovery-receipt-state.outputs.upload_required }}" == "true" ]]; then
            artifact_args+=(--artifact-id "${{ steps.recovery-persist-receipt.outputs.artifact-id }}")
          fi
          python tools/release/stable_publish.py verify-receipt \
            --repo-root "$GITHUB_WORKSPACE" \
            --receipt "$RECEIPT_PATH" \
            --report "$RECEIPT_VERIFY_PATH" \
            "${artifact_args[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse

          from tools.ci import candidate_evidence

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8"))
          verification = json.loads(
              Path(os.environ["RECEIPT_VERIFY_PATH"]).read_text(encoding="utf-8")
          )
          expected_name = "stable-publication-v0.1.1-" + os.environ["EXPECTED_PUBLICATION_KEY"]
          if (
              receipt.get("status") != "PUBLICATION_COMPLETE"
              or receipt.get("publicationComplete") is not True
              or receipt.get("publicationKey") != os.environ["EXPECTED_PUBLICATION_KEY"]
              or receipt.get("qualifiedCommit") != os.environ["EXPECTED_MAIN"]
              or receipt.get("qualifiedTree") != os.environ["EXPECTED_TREE"]
              or receipt.get("curseForge", {}).get("fileId")
                  != int(os.environ["EXISTING_CURSEFORGE_FILE_ID"])
              or verification.get("status") != "RECEIPT_PERSISTENCE_VERIFIED"
              or verification.get("artifactName") != expected_name
          ):
              raise SystemExit("FINAL_RECEIPT_READBACK_DIVERGENT_STOP")
          api = candidate_evidence.GitHub()
          index = api.get(
              "actions/artifacts?name=" + urllib.parse.quote(expected_name, safe="")
              + "&per_page=100"
          )
          active = [row for row in index.get("artifacts", []) if row.get("expired") is False]
          if index.get("total_count") != 1 or len(active) != 1:
              raise SystemExit("FINAL_RECEIPT_ARTIFACT_COUNT_STOP")
          artifact_id = active[0].get("id")
          if verification.get("artifactIds") != [artifact_id]:
              raise SystemExit("FINAL_RECEIPT_ARTIFACT_ID_STOP")
          print({
              "status": receipt["status"],
              "publicationComplete": receipt["publicationComplete"],
              "artifactName": expected_name,
              "artifactId": artifact_id,
              "fileId": receipt["curseForge"]["fileId"],
          })
          PY

  publish:
    name: Guarded CurseForge publication
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.receipt_recovery }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      MANUAL_EXCEPTIONAL_AUTHORITY: NOT_GRANTED

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Initialize separate ephemeral report paths
        shell: bash
        run: |
          echo "PREPARE_REPORT_PATH=$RUNNER_TEMP/curseforge-upload-intent.json" >> "$GITHUB_ENV"
          echo "RESULT_REPORT_PATH=$RUNNER_TEMP/curseforge-publication-result.json" >> "$GITHUB_ENV"

      - name: Test publisher failure and idempotency paths
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Validate public inputs without a CurseForge secret
        id: dry-run
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set +e
          python tools/release/publish_curseforge.py \
            --dry-run \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare exact upload intent without posting
        id: prepare
        if: ${{ !inputs.dry_run && inputs.resume_file_id == '' && env.MANUAL_EXCEPTIONAL_AUTHORITY == 'GRANTED' }}
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python tools/release/publish_curseforge.py \
            --prepare-publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --report "$PREPARE_REPORT_PATH"
          python - <<'PY'
          import json
          import os
          import re
          import sys
          sys.path.insert(0, "tools/release")
          from publish_curseforge import state_artifact_prefix
          from pathlib import Path

          prepare_path = Path(os.environ["PREPARE_REPORT_PATH"])
          report = json.loads(prepare_path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              if report.get("status") == "UPLOAD_INTENT_READY" and report.get("postRequired") is True:
                  artifact_name = (
                      f"{state_artifact_prefix(report['tag'])}{report['runKey']}--intent--"
                      f"{report['multipartSha256'][:12]}"
                  )
                  stream.write("post_required=true\n")
                  stream.write(f"artifact_name={artifact_name}\n")
              elif report.get("status") in {
                  "ALREADY_PUBLISHED",
                  "RESUMED_PUBLICATION_VERIFIED",
              } and report.get("postRequired") is False:
                  prepare_path.replace(Path(os.environ["RESULT_REPORT_PATH"]))
                  stream.write("post_required=false\n")
              else:
                  raise SystemExit("publisher returned an unsupported prepare state")
          PY

      - name: Persist upload intent before any POST
        id: persist-intent
        if: ${{ !inputs.dry_run && inputs.resume_file_id == '' && env.MANUAL_EXCEPTIONAL_AUTHORITY == 'GRANTED' && steps.prepare.outputs.post_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ env.PREPARE_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Submit exact persisted request once
        id: publish
        if: ${{ !inputs.dry_run && inputs.resume_file_id == '' && env.MANUAL_EXCEPTIONAL_AUTHORITY == 'GRANTED' && steps.prepare.outputs.post_required == 'true' && steps.persist-intent.outcome == 'success' }}
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_ID: ${{ steps.persist-intent.outputs.artifact-id }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set +e
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --run-key "$RUN_KEY" \
            --intent-report "$PREPARE_REPORT_PATH" \
            --intent-artifact-id "$INTENT_ARTIFACT_ID" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Resume an accepted file without a token or second POST
        id: resume
        if: ${{ !inputs.dry_run && inputs.resume_file_id != '' && env.MANUAL_EXCEPTIONAL_AUTHORITY == 'GRANTED' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RESUME_FILE_ID: ${{ inputs.resume_file_id }}
        run: |
          [[ "$RESUME_FILE_ID" =~ ^[1-9][0-9]*$ ]]
          set +e
          python tools/release/publish_curseforge.py \
            --publish \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$MANIFEST_PATH" \
            --tag "$REQUESTED_TAG" \
            --resume-file-id "$RESUME_FILE_ID" \
            --report "$RESULT_REPORT_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Stop exceptional manual publication without exceptional authority
        if: ${{ !inputs.dry_run && env.MANUAL_EXCEPTIONAL_AUTHORITY != 'GRANTED' }}
        shell: bash
        run: |
          echo "EXCEPTIONAL_MANUAL_AUTHORITY_REQUIRED"
          exit 2

      - name: Prepare sanitized result artifact metadata
        id: result-metadata
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          sys.path.insert(0, "tools/release")
          from publish_curseforge import state_artifact_prefix
          from pathlib import Path

          report_path = Path(os.environ["RESULT_REPORT_PATH"])
          if not report_path.is_file():
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          status = str(report.get("status", "REPORT_INVALID"))
          if status == "UPLOAD_INTENT_READY":
              raise SystemExit("an upload intent cannot be persisted as a publication result")
          if not re.fullmatch(r"[A-Z0-9_]+", status):
              status = "REPORT_INVALID"
          file_id = report.get("fileId", 0)
          if not isinstance(file_id, int) or file_id < 0:
              file_id = 0
          artifact_name = (
              f"{state_artifact_prefix(str(report.get('tag', 'unknown')))}{os.environ['RUN_KEY']}--result--{status}--{file_id}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"artifact_name={artifact_name}\n")
          PY

      - name: Persist sanitized publication result
        if: ${{ always() && steps.result-metadata.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.result-metadata.outputs.artifact_name }}
          path: ${{ env.RESULT_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Record sanitized publication verdict
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_REPORT_PATH"])
          prepare_path = Path(os.environ["PREPARE_REPORT_PATH"])
          report_path = result_path if result_path.is_file() else prepare_path
          if not report_path.is_file():
              summary = {"status": "REPORT_NOT_PRODUCED", "verdict": "FAIL"}
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              summary = {
                  key: report.get(key)
                  for key in (
                      "status",
                      "verdict",
                      "fileId",
                      "publicHashMatch",
                      "publicSha256",
                      "exitCode",
                  )
                  if key in report
              }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("### CurseForge publication\n\n")
              stream.write("```json\n")
              stream.write(json.dumps(summary, indent=2, sort_keys=True))
              stream.write("\n```\n")
          PY
