name: Pinned source audit export
on:
  push:
    branches: [codex/curseforge-publisher-migration]
    paths: [.github/workflows/source-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pinned-source-audit
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read pinned target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be5390c1a1c7d2765a4bf9c2121223e18be291e5
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Download reviewed runtime file IDs and record byte identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime-deps evidence
          python - <<'PY'
          import hashlib, io, json, pathlib, tomllib, urllib.request, zipfile
          inputs = [
            ('biomesoplenty','21.1.0.14',220318,8288121,'biomes-o-plenty','BiomesOPlenty-neoforge-1.21.1-21.1.0.14.jar'),
            ('glitchcore','2.1.0.2',955399,8109792,'glitchcore','GlitchCore-neoforge-1.21.1-2.1.0.2.jar'),
            ('terrablender','4.1.0.8',940057,6054947,'terrablender-neoforge','TerraBlender-neoforge-1.21.1-4.1.0.8.jar'),
            ('farmersdelight','1.3.2',398521,8083481,'farmers-delight','FarmersDelight-1.21.1-1.3.2.jar'),
            ('immersiveengineering','12.4.2-194',231951,6733669,'immersive-engineering','ImmersiveEngineering-1.21.1-12.4.2-194.jar'),
          ]
          lock = {'schemaVersion':1, 'source':'Official CurseForge project/file IDs verified 2026-09-05; bytes read in this CI run', 'dependencies':[]}
          for mod, version, project, file_id, slug, filename in inputs:
              url=f'https://www.curseforge.com/api/v1/mods/{project}/files/{file_id}/download'
              request=urllib.request.Request(url,headers={'User-Agent':'BOP-Harvest-Source-Audit/1'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  raw=response.read(60*1024*1024+1)
              assert len(raw)<=60*1024*1024, 'unexpected dependency size'
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  metadata=tomllib.loads(archive.read('META-INF/neoforge.mods.toml').decode('utf-8'))
                  matches=[x for x in metadata['mods'] if x['modId']==mod]
                  assert len(matches)==1, 'wrong dependency mod ID'
                  declared=matches[0]['version']
                  if declared=='${file.jarVersion}':
                      manifest=archive.read('META-INF/MANIFEST.MF').decode('utf-8')
                      declared=next(x.split(': ',1)[1] for x in manifest.splitlines() if x.startswith('Implementation-Version: '))
                  assert declared==version, f'wrong version for {mod}: {declared}'
              pathlib.Path('build/runtime-deps',filename).write_bytes(raw)
              lock['dependencies'].append({'modId':mod,'version':version,'projectId':project,'fileId':file_id,'slug':slug,'filename':filename,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'url':url})
              print(mod, version, len(raw), hashlib.sha256(raw).hexdigest())
          pathlib.Path('evidence/runtime-dependencies.lock.json').write_text(json.dumps(lock,indent=2)+'\n')
          PY
      - name: Baseline check build and runtime validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache check build --stacktrace | tee evidence/baseline-build.log
          ./gradlew --no-configuration-cache runGameTestServer runData -x syncRuntimeDeps --stacktrace | tee evidence/baseline-runtime.log
      - name: Retain qualification evidence without third-party jars
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-qualification-be5390c
          path: evidence/
          if-no-files-found: error
          retention-days: 14
