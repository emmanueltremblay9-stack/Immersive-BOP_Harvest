name: Stage source-only manifest
on:
  push:
    branches: [codex/curseforge-publisher-migration]
    paths: [.github/workflows/source-manifest-staging.yml]
permissions:
  contents: write
concurrency:
  group: source-only-manifest-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify final source ledger and store only its Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This transport-only workflow is absent from the final source tree.
          git rm --cached .github/workflows/source-manifest-staging.yml
          python scripts/refresh_project_manifest.py
          python scripts/refresh_project_manifest.py --check
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repository='emmanueltremblay9-stack/Immersive-BOP_Harvest'
          assert os.environ['GITHUB_REPOSITORY']==repository
          raw=pathlib.Path('PROJECT_MANIFEST.json').read_bytes()
          expected='dcfeb3d775d766f742132d897ca5b26aab0d6111f6aba66aebf941c9c27f2d76'
          assert hashlib.sha256(raw).hexdigest()==expected, 'Unexpected source ledger bytes'
          expected_blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          request=urllib.request.Request('https://api.github.com/repos/'+repository+'/git/blobs',method='POST',data=json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              result=json.load(response)
          assert result['sha']==expected_blob
          print(json.dumps({'status':'MANIFEST_BLOB_VERIFIED','blobSha':result['sha'],'sha256':expected,'branchMoved':False,'productionCurseForgeUpload':False}))
          PY
